<!DOCTYPE html>
<html>
<head>
    <title>NLP Handler Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .success { background-color: #d4edda; }
        .error { background-color: #f8d7da; }
    </style>
</head>
<body>
    <h1>NLP Handler Test</h1>
    <div id="test-results"></div>

    <script>
        // Mock the app object and dependencies
        window.app = {
            Settings: {
                get: () => true
            },
            Utils: {
                escapeHtml: (str) => str,
                tidyText: (str) => str
            }
        };

        window.dbHandler = {
            getIndex: () => Promise.resolve([])
        };

        // Load the NLP handler code
        fetch('/assets/js/nlp-handler.js')
            .then(response => response.text())
            .then(code => {
                // Execute the NLP handler code
                eval(code);
                
                // Run tests
                runTests();
            })
            .catch(error => {
                document.getElementById('test-results').innerHTML = 
                    '<div class="test-result error">Failed to load NLP handler: ' + error + '</div>';
            });

        function runTests() {
            const tests = [
                {
                    name: "Simple quantity and food",
                    input: "100g banana",
                    expected: { name: "banana", unit: "g", portion: 100 }
                },
                {
                    name: "Multiple items",
                    input: "100g banana, 2 cups rice",
                    expectedCount: 2
                },
                {
                    name: "Complex input",
                    input: "100g macintosh apple, 1/3 of a lil debbie zebra cake, one half cup of rice cooked",
                    expectedCount: 3
                },
                {
                    name: "Fractional quantities",
                    input: "half cup of oats",
                    expected: { name: "oats", portion: 0.5 }
                },
                {
                    name: "Number words",
                    input: "two apples",
                    expected: { name: "apples", portion: 2 }
                }
            ];

            const results = document.getElementById('test-results');
            
            tests.forEach(test => {
                try {
                    const parsed = nlpHandler.parseNaturalLanguage(test.input);
                    let success = false;
                    let message = '';

                    if (test.expectedCount) {
                        success = parsed.length === test.expectedCount;
                        message = `Expected ${test.expectedCount} items, got ${parsed.length}`;
                    } else if (test.expected) {
                        const item = parsed[0];
                        success = item && 
                                 item.name === test.expected.name && 
                                 item.unit === test.expected.unit &&
                                 Math.abs(item.portion - test.expected.portion) < 0.01;
                        message = `Expected: ${JSON.stringify(test.expected)}, Got: ${JSON.stringify(item)}`;
                    }

                    results.innerHTML += `
                        <div class="test-result ${success ? 'success' : 'error'}">
                            <strong>${test.name}</strong><br>
                            Input: "${test.input}"<br>
                            ${message}<br>
                            Full result: ${JSON.stringify(parsed, null, 2)}
                        </div>
                    `;
                } catch (error) {
                    results.innerHTML += `
                        <div class="test-result error">
                            <strong>${test.name}</strong><br>
                            Error: ${error.message}
                        </div>
                    `;
                }
            });
        }
    </script>
</body>
</html>
